<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#071a2a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74c7ff"/>
      <stop offset="0.55" stop-color="#45d483"/>
      <stop offset="1" stop-color="#ffcc66"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="55" y="55" width="1090" height="565" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  </g>

  <!-- Sidebar -->
  <rect x="75" y="75" width="240" height="525" rx="18" fill="rgba(0,0,0,0.20)" stroke="rgba(255,255,255,0.10)"/>
  <text x="100" y="120" fill="#fff" opacity="0.92" font-size="18" font-weight="700" font-family="ui-sans-serif, system-ui">DevDox</text>
  <text x="100" y="145" fill="#fff" opacity="0.62" font-size="12" font-family="ui-sans-serif, system-ui">Notes • Snippets</text>
  <rect x="95" y="190" width="200" height="38" rx="12" fill="rgba(116,199,255,0.14)" stroke="rgba(116,199,255,0.30)"/>
  <text x="110" y="214" fill="#fff" opacity="0.92" font-size="13" font-family="ui-sans-serif, system-ui">Notes</text>
  <rect x="95" y="238" width="200" height="38" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  <text x="110" y="262" fill="#fff" opacity="0.70" font-size="13" font-family="ui-sans-serif, system-ui">Snippets</text>

  <!-- Main -->
  <text x="345" y="115" fill="#fff" opacity="0.92" font-size="18" font-weight="700" font-family="ui-sans-serif, system-ui">Notes</text>

  <!-- Tree panel -->
  <rect x="335" y="140" width="320" height="460" rx="18" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.10)"/>
  <text x="360" y="175" fill="#fff" opacity="0.72" font-size="12" font-family="ui-sans-serif, system-ui">Tree</text>
  <rect x="355" y="200" width="280" height="34" rx="12" fill="rgba(116,199,255,0.14)" stroke="rgba(116,199,255,0.30)"/>
  <text x="370" y="222" fill="#fff" opacity="0.92" font-size="13" font-family="ui-sans-serif, system-ui">Kube setup</text>
  <rect x="370" y="244" width="265" height="34" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  <text x="385" y="266" fill="#fff" opacity="0.82" font-size="13" font-family="ui-sans-serif, system-ui">  └ Cluster notes</text>
  <rect x="355" y="292" width="280" height="34" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  <text x="370" y="314" fill="#fff" opacity="0.82" font-size="13" font-family="ui-sans-serif, system-ui">API checklist</text>

  <!-- Editor/Preview panel -->
  <rect x="675" y="140" width="440" height="460" rx="18" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.10)"/>
  <text x="700" y="175" fill="#fff" opacity="0.92" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui">Kube setup</text>
  <rect x="700" y="195" width="150" height="28" rx="14" fill="rgba(116,199,255,0.12)" stroke="rgba(116,199,255,0.26)"/>
  <text x="720" y="214" fill="#fff" opacity="0.86" font-size="12" font-family="ui-sans-serif, system-ui">Preview (md)</text>
  <rect x="700" y="240" width="390" height="330" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  <text x="720" y="280" fill="#fff" opacity="0.80" font-size="13" font-family="ui-sans-serif, system-ui">## Steps</text>
  <text x="720" y="310" fill="#fff" opacity="0.72" font-size="13" font-family="ui-sans-serif, system-ui">- Create namespace</text>
  <text x="720" y="338" fill="#fff" opacity="0.72" font-size="13" font-family="ui-sans-serif, system-ui">- Apply manifests</text>
  <text x="720" y="366" fill="#fff" opacity="0.72" font-size="13" font-family="ui-sans-serif, system-ui">- Verify rollout</text>
  <rect x="720" y="400" width="350" height="90" rx="12" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.12)"/>
  <text x="740" y="428" fill="url(#acc)" opacity="0.95" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas">kubectl get pods -n my-ns</text>
  <text x="740" y="452" fill="rgba(255,255,255,0.70)" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas">kubectl logs deploy/api</text>

</svg>


