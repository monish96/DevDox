    <path d="M34 38h52M34 62h44M34 86h36" stroke="url(#acc)" stroke-width="10" stroke-linecap="round"/>
    <path d="M78 92l14 14-14 14" fill="none" stroke="url(#acc)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
