<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="250" cy="160" r="140" fill="#2a6cff" opacity="0.25" filter="url(#blur)"/>
  <circle cx="980" cy="520" r="190" fill="#7a42ff" opacity="0.22" filter="url(#blur)"/>

  <!-- App shell -->
  <rect x="70" y="70" width="1060" height="580" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- Sidebar -->
  <rect x="70" y="70" width="230" height="580" rx="22" fill="#0c1224" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="105" y="120" fill="#e7ecff" font-family="Inter, system-ui, -apple-system" font-size="26" font-weight="800">DevDox</text>
  <text x="105" y="150" fill="#9aa6c7" font-family="Inter, system-ui, -apple-system" font-size="12">Your local-first dev cockpit</text>
  <g fill="#9aa6c7" font-family="Inter, system-ui, -apple-system" font-size="13" font-weight="600">
    <text x="105" y="220">Dashboard</text>
    <text x="105" y="260" fill="#e7ecff">Todos</text>
    <text x="105" y="300">Notes</text>
    <text x="105" y="340">Diagrams</text>
    <text x="105" y="380">Voice</text>
    <text x="105" y="420">Tools</text>
    <text x="105" y="460">Settings</text>
  </g>

  <!-- Content -->
  <rect x="320" y="70" width="810" height="580" rx="22" fill="#0b0f1c" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="350" y="120" fill="#e7ecff" font-family="Inter, system-ui, -apple-system" font-size="22" font-weight="800">Todos</text>
  <text x="350" y="145" fill="#9aa6c7" font-family="Inter, system-ui, -apple-system" font-size="12">Jira-style Kanban • drag & drop • quick add</text>

  <!-- New todo button -->
  <rect x="1056" y="96" width="46" height="46" rx="16" fill="#10243a" stroke="#74c7ff" stroke-opacity="0.55"/>
  <path d="M1079 109v20M1069 119h20" stroke="#e7ecff" stroke-width="2" stroke-linecap="round"/>

  <!-- Columns -->
  <g filter="url(#shadow)">
    <rect x="350" y="175" width="240" height="430" rx="18" fill="#0e1426" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="610" y="175" width="240" height="430" rx="18" fill="#0e1426" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="870" y="175" width="240" height="430" rx="18" fill="#0e1426" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>

  <g fill="#e7ecff" font-family="Inter, system-ui, -apple-system" font-size="14" font-weight="800">
    <text x="370" y="210">Todo</text>
    <text x="630" y="210">Doing</text>
    <text x="890" y="210">Done</text>
  </g>

  <!-- Cards -->
  <g>
    <!-- todo -->
    <rect x="365" y="235" width="210" height="74" rx="16" fill="#0b0f1c" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="382" y="263" fill="#e7ecff" font-family="Inter, system-ui" font-size="13" font-weight="750">Ship Settings screen</text>
    <circle cx="382" cy="286" r="5" fill="#ffcc66" opacity="0.8"/>
    <rect x="395" y="279" width="54" height="16" rx="999" fill="#111a2f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="406" y="291" fill="#9aa6c7" font-family="Inter, system-ui" font-size="10" font-weight="650">settings</text>
    <rect x="505" y="279" width="58" height="16" rx="999" fill="#111a2f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="516" y="291" fill="#9aa6c7" font-family="Inter, system-ui" font-size="10" font-weight="650">kanban</text>

    <rect x="365" y="320" width="210" height="74" rx="16" fill="#0b0f1c" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="382" y="348" fill="#e7ecff" font-family="Inter, system-ui" font-size="13" font-weight="750">Polish drag animation</text>
    <circle cx="382" cy="371" r="5" fill="#ff8c5c" opacity="0.85"/>
    <rect x="395" y="364" width="48" height="16" rx="999" fill="#111a2f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="406" y="376" fill="#9aa6c7" font-family="Inter, system-ui" font-size="10" font-weight="650">dnd</text>
    <rect x="503" y="364" width="62" height="16" rx="999" fill="#111a2f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="515" y="376" fill="#9aa6c7" font-family="Inter, system-ui" font-size="10" font-weight="650">ux</text>

    <!-- doing -->
    <rect x="625" y="235" width="210" height="74" rx="16" fill="#0b0f1c" stroke="#74c7ff" stroke-opacity="0.28"/>
    <text x="642" y="263" fill="#e7ecff" font-family="Inter, system-ui" font-size="13" font-weight="750">Refactor quick add</text>
    <circle cx="642" cy="286" r="5" fill="#ffcc66" opacity="0.8"/>
    <rect x="655" y="279" width="50" height="16" rx="999" fill="#111a2f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="666" y="291" fill="#9aa6c7" font-family="Inter, system-ui" font-size="10" font-weight="650">ui</text>
    <rect x="763" y="279" width="64" height="16" rx="999" fill="#111a2f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="775" y="291" fill="#9aa6c7" font-family="Inter, system-ui" font-size="10" font-weight="650">todos</text>

    <!-- done compact -->
    <rect x="885" y="235" width="210" height="48" rx="16" fill="#0b0f1c" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="902" y="262" fill="#e7ecff" font-family="Inter, system-ui" font-size="13" font-weight="750">Fix build</text>
    <rect x="1036" y="246" width="52" height="18" rx="999" fill="#101a2f" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1048" y="259" fill="#9aa6c7" font-family="Inter, system-ui" font-size="10" font-weight="650">today</text>
  </g>
</svg>


